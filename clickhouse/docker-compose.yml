# Package clickhouse (bước LOAD): kho dữ liệu và Storage Writer.
# Storage Writer = bảng engine Kafka + materialized view, định nghĩa trong init.sql.
# ClickHouse đọc các topic parsed-logs, rejected-logs, alerts của Kafka (package log_producer) qua mạng log_network.
# Chạy riêng package này:  docker network create log_network ; docker compose up -d

name: log-pattern-pipeline

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [log_network]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clickhouse-data:

networks:
  log_network:
    name: log_network
    external: true        # mạng dùng chung của cả năm package; tạo bằng: docker network create log_network
