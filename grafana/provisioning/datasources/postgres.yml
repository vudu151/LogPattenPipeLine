apiVersion: 1
datasources:
  - name: PostgreSQL-logs
    uid: pg-logs
    type: postgres
    access: proxy
    url: postgres:5432
    user: app
    isDefault: false
    secureJsonData:
      password: app
    jsonData:
      database: logs
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
  - name: ClickHouse-logs
    uid: ch-logs
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: app
      defaultDatabase: logs
    secureJsonData:
      password: app
