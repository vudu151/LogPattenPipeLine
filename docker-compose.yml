# Tệp gốc: gộp năm package lại để chạy cả hệ thống bằng một lệnh (docker compose up -d, hoặc ./pipeline.sh up).
# Mỗi package có docker-compose.yml và .env riêng, chạy độc lập được, và đều dùng chung mạng `log_network`.
#
#   log_producer/   Extract   : Kafka (+ Kafka UI); Log Producer chạy trên máy host
#   spark/          Transform : Spark master + worker, Redis, PostgreSQL
#   clickhouse/     Load      : kho dữ liệu ClickHouse
#   ML/             mô hình phát hiện bất thường (huấn luyện, đánh giá)
#   grafana/        dashboard
#
# Mạng dùng chung phải có trước:  docker network create log_network   (./pipeline.sh up tự tạo)

name: log-pattern-pipeline

include:
  - log_producer/docker-compose.yml
  - spark/docker-compose.yml
  - clickhouse/docker-compose.yml
  - ML/docker-compose.yml
  - grafana/docker-compose.yml
